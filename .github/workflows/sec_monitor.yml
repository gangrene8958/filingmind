name: SEC Filings Monitor

on:
  schedule:
    # De dilluns a divendres a les 22:00 UTC
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

# Cal permís d'escriptura per fer commit de processed_filings.json
permissions:
  contents: write

# Evita dues execucions simultànies que es trepitgin l'estat
concurrency:
  group: sec-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout del repositori
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar els tests (verificador de xifres)
        run: |
          pip install pytest
          python -m pytest -q tests

      - name: Executar l'auditoria de filings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: python main.py

      - name: Desar l'estat (commit i push)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processed_filings.json
          if git diff --cached --quiet; then
            echo "Cap canvi a processed_filings.json"
          else
            git commit -m "chore: actualitzar processed_filings.json [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
